<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Brick Factory Cost Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF7F0;
    --ink:#1F2A24;
    --ink-soft:#54615A;
    --gold:#E8A93B;
    --gold-dark:#C98C22;
    --teal:#1B6B5A;
    --teal-soft:#E4F1EC;
    --red:#C1523D;
    --red-soft:#F7E7E2;
    --amber-soft:#FBF0DA;
    --line:#E4DCCB;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:40px;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces',serif; }
  #app{ max-width:760px; margin:0 auto; padding:0 16px; }

  .topbar{ padding:22px 4px 6px; }
  .topbar .name{ font-family:'Fraunces',serif; font-weight:600; font-size:24px; letter-spacing:-0.01em; }
  .topbar .sub{ font-size:13px; color:var(--ink-soft); margin-top:4px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .card h2{ font-size:16px; margin:0 0 4px; }
  .card .hint{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; }

  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
  @media (max-width:520px){ .field-grid{ grid-template-columns:1fr; } }
  .field label{ display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
  .field .note{ font-size:11.5px; color:var(--ink-soft); font-weight:400; margin-left:4px; }
  .field input[type=number]{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14.5px;
    font-family:'Work Sans',sans-serif; background:#fff;
  }
  .field input[type=number]:focus{ outline:2px solid var(--teal); outline-offset:-1px; }

  .total-line{ display:flex; justify-content:space-between; align-items:center; padding-top:12px; margin-top:4px; border-top:1px dashed var(--line); font-weight:600; font-size:14.5px; }
  .total-line .amt{ font-family:'Fraunces',serif; color:var(--teal); font-size:17px; }

  .adv-toggle{ background:none; border:none; color:var(--teal); font-size:12.5px; font-weight:600; cursor:pointer; padding:0; margin-top:10px; }
  .adv-body{ margin-top:12px; }
  .adv-body[hidden]{ display:none; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ text-align:right; padding:9px 6px; border-bottom:1px solid var(--line); }
  th:first-child,td:first-child{ text-align:left; }
  th{ color:var(--ink-soft); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.02em; }
  td input[type=number]{ width:90px; text-align:right; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13.5px; font-family:'Work Sans',sans-serif; }
  tr.grand td{ font-weight:700; border-top:2px solid var(--ink); border-bottom:none; padding-top:12px; }
  tr.grand td.amt{ font-family:'Fraunces',serif; color:var(--teal); }
  .profit-neg{ color:var(--red); }
  .profit-pos{ color:var(--teal); }
  .table-wrap{ overflow-x:auto; }
  #resultsEmpty[hidden], #resultsTableWrap[hidden]{ display:none; }

  .bar-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; margin-bottom:8px; }
  .bar-row .label{ width:78px; flex-shrink:0; color:var(--ink-soft); }
  .bar-track{ flex:1; height:9px; background:var(--amber-soft); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--gold); }
  .bar-row .val{ width:80px; flex-shrink:0; text-align:right; font-weight:600; }

  .btn-row{ display:flex; gap:10px; margin:4px 0 22px; }
  .btn-primary{
    flex:1; background:var(--gold); color:var(--ink); border:none; border-radius:12px;
    padding:13px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:'Work Sans',sans-serif;
  }
  .btn-primary:active{ background:var(--gold-dark); }
  .btn-secondary{
    flex:1; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:12px;
    padding:13px; font-size:14.5px; font-weight:600; cursor:pointer;
  }

  .history-item{ display:flex; justify-content:space-between; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .history-item:last-child{ border-bottom:none; }
  .history-item .hi-date{ color:var(--ink-soft); font-size:12px; }
  .history-item .hi-total{ font-family:'Fraunces',serif; font-weight:600; color:var(--teal); }
  .history-actions button{ background:none; border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; margin-left:6px; }
  .empty-hint{ text-align:center; color:var(--ink-soft); font-size:13px; padding:16px 0; }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:10px; font-size:13px; z-index:999; opacity:0; transition:opacity .25s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ SIZES / FIELDS ============ */
const SIZES = [
  { key:'s10', label:'10" brick', defaultWeight:1 },
  { key:'s15', label:'15" brick', defaultWeight:1.5 },
  { key:'s20', label:'20" brick', defaultWeight:2 },
];
const COST_FIELDS = [
  { key:'komiche', label:'Komiche' },
  { key:'cement', label:'Cement' },
  { key:'labor', label:'Labor cost' },
  { key:'water', label:'Water' },
  { key:'other', label:'Other' },
];

/* ============ STATE ============ */
const state = {
  costs: { komiche:'', cement:'', labor:'', water:'', other:'' },
  qty: { s10:'', s15:'', s20:'' },
  weight: { s10:1, s15:1.5, s20:2 },
  price: { s10:'', s15:'', s20:'' },
  history: [],
};

function loadHistory(){
  try { state.history = JSON.parse(localStorage.getItem('brickFactoryBatches')||'[]'); }
  catch(e){ state.history = []; }
}
function saveHistory(){
  try { localStorage.setItem('brickFactoryBatches', JSON.stringify(state.history)); }
  catch(e){}
}

/* ============ HELPERS ============ */
function $(id){ return document.getElementById(id); }
function num(v){ const n = parseFloat(v); return isNaN(n) || n<0 ? 0 : n; }
function fmt(n){ return Number(n||0).toLocaleString('en-US', { maximumFractionDigits:2 }); }
function showToast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function totalCost(){
  return COST_FIELDS.reduce((s,f)=>s+num(state.costs[f.key]), 0);
}
function equivalentUnits(){
  return SIZES.reduce((s,sz)=>s+num(state.qty[sz.key])*num(state.weight[sz.key]), 0);
}
function baseUnitCost(){
  const eq = equivalentUnits();
  return eq>0 ? totalCost()/eq : 0;
}
function unitCostFor(szKey){
  return baseUnitCost() * num(state.weight[szKey]);
}
function totalQty(){
  return SIZES.reduce((s,sz)=>s+num(state.qty[sz.key]), 0);
}
function totalProfit(){
  return SIZES.reduce((s,sz)=>{
    const qty = num(state.qty[sz.key]);
    const profit = (num(state.price[sz.key]) - unitCostFor(sz.key)) * qty;
    return s + profit;
  }, 0);
}

/* ============ ONE-TIME SKELETON BUILD ============ */
function buildSkeleton(){
  const app = $('app');
  app.innerHTML = `
    <div class="topbar">
      <div class="name">Brick Factory Cost Calculator</div>
      <div class="sub">Enter your manufacturing costs and production quantities to find the true cost and profit per brick.</div>
    </div>

    <div class="card">
      <h2>Manufacturing costs</h2>
      <p class="hint">Total cost for this production batch, in ETB.</p>
      <div class="field-grid">
        ${COST_FIELDS.map(f=>`
          <div class="field">
            <label>${f.label}</label>
            <input type="number" min="0" inputmode="decimal" id="cost-${f.key}" placeholder="0">
          </div>`).join('')}
      </div>
      <div class="total-line"><span>Total manufacturing cost</span><span class="amt" id="out-totalCost">0 ETB</span></div>
    </div>

    <div class="card">
      <h2>Production quantities</h2>
      <p class="hint">How many of each brick size came out of this batch.</p>
      <div class="field-grid">
        ${SIZES.map(sz=>`
          <div class="field">
            <label>${sz.label}</label>
            <input type="number" min="0" inputmode="decimal" id="qty-${sz.key}" placeholder="0">
          </div>`).join('')}
      </div>
      <button class="adv-toggle" id="advToggleBtn">Adjust material-weight ratios &#9662;</button>
      <div class="adv-body" id="advBody" hidden>
        <p class="hint" style="margin-bottom:10px;">
          A bigger brick uses more raw material, so its share of the cost should be bigger too.
          These weights say how much material each size uses relative to the 10" brick (default 1&nbsp;:&nbsp;1.5&nbsp;:&nbsp;2). Adjust if your mix is different.
        </p>
        <div class="field-grid">
          ${SIZES.map(sz=>`
            <div class="field">
              <label>${sz.label} weight</label>
              <input type="number" min="0.01" step="0.01" id="weight-${sz.key}">
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Cost &amp; profit per brick</h2>
      <p class="hint">Selling price is optional &mdash; add it to see your profit per brick and per size.</p>
      <div class="empty-hint" id="resultsEmpty">Enter production quantities above to see the cost breakdown.</div>
      <div class="table-wrap" id="resultsTableWrap" hidden>
        <table>
          <thead><tr>
            <th>Size</th><th>Qty</th><th>Cost / brick</th><th>Total cost</th><th>Selling price</th><th>Profit / brick</th><th>Total profit</th>
          </tr></thead>
          <tbody>
            ${SIZES.map(sz=>`
              <tr>
                <td>${sz.label}</td>
                <td id="out-qty-${sz.key}">0</td>
                <td id="out-unitCost-${sz.key}">0 ETB</td>
                <td id="out-lineCost-${sz.key}">0 ETB</td>
                <td><input type="number" min="0" inputmode="decimal" id="price-${sz.key}" placeholder="&ndash;"></td>
                <td id="out-profitUnit-${sz.key}">&ndash;</td>
                <td id="out-profitLine-${sz.key}">&ndash;</td>
              </tr>`).join('')}
            <tr class="grand">
              <td>Total</td>
              <td id="out-grandQty">0</td>
              <td></td>
              <td class="amt" id="out-grandCost">0 ETB</td>
              <td></td>
              <td></td>
              <td class="amt" id="out-grandProfit">0 ETB</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Where the cost goes</h2>
      <div style="margin-top:10px;">
        ${COST_FIELDS.map(f=>`
          <div class="bar-row">
            <div class="label">${f.label}</div>
            <div class="bar-track"><div class="bar-fill" id="bar-fill-${f.key}" style="width:0%;"></div></div>
            <div class="val" id="bar-val-${f.key}">0%</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" id="resetBtn">Reset</button>
      <button class="btn-primary" id="saveBatchBtn">Save this batch</button>
    </div>

    <div class="card">
      <h2>Saved batches</h2>
      <div id="historyList"></div>
    </div>
  `;

  COST_FIELDS.forEach(f=>{
    $(`cost-${f.key}`).addEventListener('input', e=>{ state.costs[f.key] = e.target.value; recompute(); });
  });
  SIZES.forEach(sz=>{
    $(`qty-${sz.key}`).addEventListener('input', e=>{ state.qty[sz.key] = e.target.value; recompute(); });
    $(`weight-${sz.key}`).value = state.weight[sz.key];
    $(`weight-${sz.key}`).addEventListener('input', e=>{
      state.weight[sz.key] = e.target.value===''? '' : parseFloat(e.target.value);
      recompute();
    });
    $(`price-${sz.key}`).addEventListener('input', e=>{ state.price[sz.key] = e.target.value; recompute(); });
  });

  $('advToggleBtn').addEventListener('click', ()=>{
    const body = $('advBody');
    body.hidden = !body.hidden;
    $('advToggleBtn').innerHTML = (body.hidden ? 'Adjust' : 'Hide') + ' material-weight ratios &#9662;';
  });
  $('resetBtn').addEventListener('click', resetForm);
  $('saveBatchBtn').addEventListener('click', saveBatch);
}

/* ============ TARGETED RECOMPUTE (never rebuilds inputs) ============ */
function recompute(){
  $('out-totalCost').textContent = fmt(totalCost()) + ' ETB';

  const eq = equivalentUnits();
  $('resultsEmpty').hidden = eq > 0;
  $('resultsTableWrap').hidden = eq <= 0;

  if (eq > 0){
    SIZES.forEach(sz=>{
      const qty = num(state.qty[sz.key]);
      const unitCost = unitCostFor(sz.key);
      const lineCost = unitCost*qty;
      const price = state.price[sz.key];
      const hasPrice = price!=='' && price!=null;
      const profitUnit = hasPrice ? num(price)-unitCost : null;
      const profitLine = hasPrice ? profitUnit*qty : null;

      $(`out-qty-${sz.key}`).textContent = fmt(qty);
      $(`out-unitCost-${sz.key}`).textContent = fmt(unitCost) + ' ETB';
      $(`out-lineCost-${sz.key}`).textContent = fmt(lineCost) + ' ETB';

      const profitUnitEl = $(`out-profitUnit-${sz.key}`);
      const profitLineEl = $(`out-profitLine-${sz.key}`);
      profitUnitEl.textContent = hasPrice ? fmt(profitUnit)+' ETB' : '–';
      profitUnitEl.className = hasPrice ? (profitUnit>=0?'profit-pos':'profit-neg') : '';
      profitLineEl.textContent = hasPrice ? fmt(profitLine)+' ETB' : '–';
      profitLineEl.className = hasPrice ? (profitLine>=0?'profit-pos':'profit-neg') : '';
    });
    $('out-grandQty').textContent = fmt(totalQty());
    $('out-grandCost').textContent = fmt(totalCost()) + ' ETB';
    $('out-grandProfit').textContent = fmt(totalProfit()) + ' ETB';
  }

  const total = totalCost();
  COST_FIELDS.forEach(f=>{
    const v = num(state.costs[f.key]);
    const pct = total>0 ? (v/total*100) : 0;
    $(`bar-fill-${f.key}`).style.width = pct + '%';
    $(`bar-val-${f.key}`).textContent = fmt(pct) + '%';
  });
}

/* ============ ACTIONS ============ */
function resetForm(){
  if (!confirm('Clear all costs, quantities and prices?')) return;
  state.costs = { komiche:'', cement:'', labor:'', water:'', other:'' };
  state.qty = { s10:'', s15:'', s20:'' };
  state.price = { s10:'', s15:'', s20:'' };
  state.weight = { s10:1, s15:1.5, s20:2 };
  applyStateToInputs();
  recompute();
}

function applyStateToInputs(){
  COST_FIELDS.forEach(f=>{ $(`cost-${f.key}`).value = state.costs[f.key]; });
  SIZES.forEach(sz=>{
    $(`qty-${sz.key}`).value = state.qty[sz.key];
    $(`weight-${sz.key}`).value = state.weight[sz.key];
    $(`price-${sz.key}`).value = state.price[sz.key];
  });
}

function saveBatch(){
  if (totalCost()<=0 || totalQty()<=0){ showToast('Add costs and quantities first'); return; }
  const batch = {
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    savedAt: Date.now(),
    costs: {...state.costs},
    qty: {...state.qty},
    weight: {...state.weight},
    price: {...state.price},
    totalCost: totalCost(),
    totalQty: totalQty(),
    totalProfit: totalProfit(),
  };
  state.history.push(batch);
  saveHistory();
  showToast('Batch saved');
  renderHistory();
}
function loadBatch(id){
  const b = state.history.find(x=>x.id===id);
  if (!b) return;
  state.costs = {...b.costs};
  state.qty = {...b.qty};
  state.weight = {...b.weight};
  state.price = {...b.price};
  applyStateToInputs();
  recompute();
  showToast('Batch loaded');
  window.scrollTo(0,0);
}
function deleteBatch(id){
  if (!confirm('Delete this saved batch?')) return;
  state.history = state.history.filter(x=>x.id!==id);
  saveHistory();
  renderHistory();
}
window.loadBatch = loadBatch;
window.deleteBatch = deleteBatch;

function renderHistory(){
  const el = $('historyList');
  if (state.history.length===0){
    el.innerHTML = `<div class="empty-hint">No batches saved yet.</div>`;
    return;
  }
  el.innerHTML = state.history.slice().reverse().map(b=>`
    <div class="history-item">
      <div>
        <div>${fmt(b.totalCost)} ETB &middot; ${fmt(b.totalQty)} bricks</div>
        <div class="hi-date">${new Date(b.savedAt).toLocaleString()}</div>
      </div>
      <div class="history-actions">
        <button onclick="loadBatch('${b.id}')">Load</button>
        <button onclick="deleteBatch('${b.id}')">Delete</button>
      </div>
    </div>`).join('');
}

/* ============ BOOT ============ */
(function boot(){
  loadHistory();
  buildSkeleton();
  recompute();
  renderHistory();
})();
</script>
</body>
</html>
