<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Brick Factory Cost Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF7F0;
    --ink:#1F2A24;
    --ink-soft:#54615A;
    --gold:#E8A93B;
    --gold-dark:#C98C22;
    --teal:#1B6B5A;
    --teal-soft:#E4F1EC;
    --red:#C1523D;
    --red-soft:#F7E7E2;
    --amber-soft:#FBF0DA;
    --line:#E4DCCB;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:78px;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces',serif; }
  #app{ max-width:760px; margin:0 auto; padding:0 16px; }

  .topbar{ padding:20px 4px 16px; display:flex; align-items:center; gap:12px; }
  .topbar .brand-mark{
    width:42px; height:42px; border-radius:12px; background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .topbar .brand-mark svg{ width:24px; height:24px; }
  .topbar .name{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; letter-spacing:-0.01em; line-height:1.2; }
  .topbar .sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  .screen[hidden]{ display:none; }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px;
    box-shadow:0 1px 2px rgba(31,42,36,.04), 0 4px 14px rgba(31,42,36,.05);
  }
  .card h2{ font-size:16px; margin:0 0 4px; display:flex; align-items:center; gap:9px; }
  .card h2 .card-icon{
    width:30px; height:30px; border-radius:9px; background:var(--teal-soft); color:var(--teal);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .card h2 .card-icon svg{ width:16px; height:16px; }
  .card .hint{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; }

  .stat-row{ display:flex; gap:10px; margin-bottom:18px; }
  .stat-tile{ flex:1; border-radius:12px; padding:13px 8px; text-align:center; }
  .stat-tile .stat-val{ font-family:'Fraunces',serif; font-weight:700; font-size:16px; line-height:1.2; }
  .stat-tile .stat-label{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  @media (max-width:360px){ .stat-tile .stat-val{ font-size:14px; } }

  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
  @media (max-width:520px){ .field-grid{ grid-template-columns:1fr; } }
  .field label{ display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
  .field .note{ font-size:11.5px; color:var(--ink-soft); font-weight:400; margin-left:4px; }
  .field input[type=number], .field input[type=date]{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14.5px;
    font-family:'Work Sans',sans-serif; background:#fff;
  }
  .field input:focus{ outline:2px solid var(--teal); outline-offset:-1px; }

  .subgroup{ border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; background:var(--amber-soft); }
  .subgroup .subgroup-title{ font-size:12.5px; font-weight:700; margin-bottom:10px; color:var(--ink); }
  .subgroup .field-grid{ gap:10px 12px; }

  .total-line{ display:flex; justify-content:space-between; align-items:center; padding-top:12px; margin-top:4px; border-top:1px dashed var(--line); font-weight:600; font-size:14.5px; }
  .total-line .amt{ font-family:'Fraunces',serif; color:var(--teal); font-size:17px; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ text-align:right; padding:9px 6px; border-bottom:1px solid var(--line); }
  th:first-child,td:first-child{ text-align:left; }
  th{ color:var(--ink-soft); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.02em; }
  tr.grand td{ font-weight:700; border-top:2px solid var(--ink); border-bottom:none; padding-top:12px; }
  tr.grand td.amt{ font-family:'Fraunces',serif; color:var(--teal); }
  .table-wrap{ overflow-x:auto; }
  [hidden]{ display:none !important; }

  .bar-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; margin-bottom:8px; }
  .bar-row .label{ width:78px; flex-shrink:0; color:var(--ink-soft); }
  .bar-track{ flex:1; height:9px; background:var(--amber-soft); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--gold); }
  .bar-row .val{ width:80px; flex-shrink:0; text-align:right; font-weight:600; }

  .btn-row{ display:flex; gap:10px; margin:4px 0 22px; }
  .btn-primary{
    flex:1; background:var(--gold); color:var(--ink); border:none; border-radius:12px;
    padding:13px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:'Work Sans',sans-serif;
  }
  .btn-primary:active{ background:var(--gold-dark); }
  .btn-secondary{
    flex:1; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:12px;
    padding:13px; font-size:14.5px; font-weight:600; cursor:pointer;
  }

  .seg-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .seg-btn{ flex:1; min-width:70px; padding:9px 6px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); }
  .seg-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  select#reportYearSelect{ border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13.5px; font-family:'Work Sans',sans-serif; background:#fff; margin-bottom:14px; }

  .history-item{ padding:12px 4px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .history-item:last-child{ border-bottom:none; }
  .history-item .hi-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .history-item .hi-date{ color:var(--ink-soft); font-size:12px; }
  .history-item .hi-total{ font-family:'Fraunces',serif; font-weight:600; color:var(--teal); }
  .history-actions{ flex-shrink:0; }
  .history-actions button{ background:none; border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; margin-left:6px; }
  .history-detail{ margin-top:10px; }
  .entry-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; gap:8px; }
  .entry-row:last-child{ border-bottom:none; }
  .entry-row .er-main{ flex:1; }
  .entry-row .er-date{ color:var(--ink-soft); font-size:11.5px; }
  .empty-hint{ text-align:center; color:var(--ink-soft); font-size:13px; padding:16px 0; }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:10px; font-size:13px; z-index:999; opacity:0; transition:opacity .25s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; }

  .tabbar{
    position:fixed; bottom:0; left:0; right:0; max-width:760px; margin:0 auto;
    background:#fff; border-top:1px solid var(--line); display:flex; z-index:50;
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 4px 8px; cursor:pointer; color:var(--ink-soft); font-size:11px; font-weight:600; background:none; border:none;
    font-family:'Work Sans',sans-serif;
  }
  .tab svg{ width:21px; height:21px; }
  .tab.active{ color:var(--teal); }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ CONSTANTS ============ */
const SIZES = [
  { key:'s10', label:'10" brick' },
  { key:'s15', label:'15" brick' },
  { key:'s20', label:'20" brick' },
];
const COST_ROWS = [
  { key:'komicheCost', label:'Komiche' },
  { key:'cementCost', label:'Cement' },
  { key:'labor', label:'Labor cost' },
  { key:'water', label:'Water' },
  { key:'other', label:'Other' },
];
const ETHIOPIAN_MONTHS = ['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit','Megabit','Miazia','Ginbot','Sene','Hamle','Nehase','Pagume'];
const JD_EPOCH_OFFSET_AMETE_MIHRET = 1723856;

/* ============ ICONS (inline SVG, stroke, currentColor) ============ */
const ICONS = {
  brand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h7v6H4zM13 8h7v6h-7zM4 16h16"/></svg>',
  record: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  overview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M3 20h18"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M16 12h2.5"/></svg>',
  boxes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 21v-9"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H4a1 1 0 00-1 1v8l10 10 9-9L12 2z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v4M16 3v4"/></svg>',
};

/* ============ STATE (persisted arrays are the source of truth) ============ */
const state = {
  costEntries: [],       // { id, dateKey, monthKey, komicheCost, komicheCars, cementCost, cementKuntal, labor, water, other, createdAt }
  productionEntries: [], // { id, dateKey, monthKey, qty:{s10,s15,s20}, createdAt }
  salesEntries: [],      // { id, dateKey, monthKey, sizes:{s10:{qty,price}, s15:{...}, s20:{...}}, createdAt }
  reportPeriod: 3,       // 3 | 6 | 9 | 13 (13 = full year incl. Pagume)
  reportYear: null,
  openMonthKey: null,
  editing: { cost:null, production:null, sale:null }, // holds the id being edited, per form
};

function loadData(){
  try { state.costEntries = JSON.parse(localStorage.getItem('brickFactoryCostEntries')||'[]'); } catch(e){ state.costEntries = []; }
  try { state.productionEntries = JSON.parse(localStorage.getItem('brickFactoryProductionEntries')||'[]'); } catch(e){ state.productionEntries = []; }
  try { state.salesEntries = JSON.parse(localStorage.getItem('brickFactorySalesEntries')||'[]'); } catch(e){ state.salesEntries = []; }
}
function saveCosts(){ try { localStorage.setItem('brickFactoryCostEntries', JSON.stringify(state.costEntries)); } catch(e){} }
function saveProduction(){ try { localStorage.setItem('brickFactoryProductionEntries', JSON.stringify(state.productionEntries)); } catch(e){} }
function saveSales(){ try { localStorage.setItem('brickFactorySalesEntries', JSON.stringify(state.salesEntries)); } catch(e){} }

/* ============ ETHIOPIAN CALENDAR ============ */
function gregorianToJdn(year, month, day){
  const a = Math.floor((14 - month) / 12);
  const y = year + 4800 - a;
  const m = month + 12 * a - 3;
  return day + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
}
function jdnToEthiopian(jdn){
  const r = (jdn - JD_EPOCH_OFFSET_AMETE_MIHRET) % 1461;
  const n = (r % 365) + 365 * Math.floor(r / 1460);
  const year = 4 * Math.floor((jdn - JD_EPOCH_OFFSET_AMETE_MIHRET) / 1461) + Math.floor(r / 365) - Math.floor(r / 1460);
  const month = Math.floor(n / 30) + 1;
  const day = (n % 30) + 1;
  return { year, month, day };
}
function ethiopianToJdn(year, month, day){
  const n = 30*(month-1) + (day-1);
  const cycles = Math.floor(year/4);
  const k = year - 4*cycles;
  const r = (n === 365) ? 1460 : (k*365 + n);
  return 1461*cycles + r + JD_EPOCH_OFFSET_AMETE_MIHRET;
}
function jdnToGregorian(jdn){
  const a = jdn + 32044;
  const b = Math.floor((4*a+3)/146097);
  const c = a - Math.floor((146097*b)/4);
  const d = Math.floor((4*c+3)/1461);
  const e = c - Math.floor((1461*d)/4);
  const m = Math.floor((5*e+2)/153);
  const day = e - Math.floor((153*m+2)/5) + 1;
  const month = m + 3 - 12*Math.floor(m/10);
  const year = 100*b + d - 4800 + Math.floor(m/10);
  return { year, month, day };
}
function pad2(n){ return String(n).padStart(2,'0'); }
function ethFromDateStr(str){
  const [y,m,d] = str.split('-').map(Number);
  return jdnToEthiopian(gregorianToJdn(y,m,d));
}
function dateKeyToGregorianInput(dateKey){
  const [y,m,d] = dateKey.split('-').map(Number);
  const g = jdnToGregorian(ethiopianToJdn(y,m,d));
  return g.year + '-' + pad2(g.month) + '-' + pad2(g.day);
}
function ethDateKey(e){ return e.year + '-' + pad2(e.month) + '-' + pad2(e.day); }
function ethMonthKey(e){ return e.year + '-' + pad2(e.month); }
function todayInputValue(){
  const n = new Date();
  return n.getFullYear() + '-' + pad2(n.getMonth()+1) + '-' + pad2(n.getDate());
}
function monthLabel(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return (ETHIOPIAN_MONTHS[m-1] || ('Month '+m)) + ' ' + y + ' E.C.';
}
function dayLabel(dateKey){
  const [y,m,d] = dateKey.split('-').map(Number);
  return d + ' ' + (ETHIOPIAN_MONTHS[m-1]||('M'+m)) + ' ' + y;
}

/* ============ HELPERS ============ */
function $(id){ return document.getElementById(id); }
function num(v){ const n = parseFloat(v); return isNaN(n) || n<0 ? 0 : n; }
function fmt(n){ return Number(n||0).toLocaleString('en-US', { maximumFractionDigits:2 }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function showToast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============ AGGREGATION ============ */
function costsInYearRange(year, monthMin, monthMax){
  return state.costEntries.filter(e=>{
    const [y,m] = e.monthKey.split('-').map(Number);
    return y===year && m>=monthMin && m<=monthMax;
  });
}
function productionInYearRange(year, monthMin, monthMax){
  return state.productionEntries.filter(e=>{
    const [y,m] = e.monthKey.split('-').map(Number);
    return y===year && m>=monthMin && m<=monthMax;
  });
}
function salesInYearRange(year, monthMin, monthMax){
  return state.salesEntries.filter(e=>{
    const [y,m] = e.monthKey.split('-').map(Number);
    return y===year && m>=monthMin && m<=monthMax;
  });
}
function sumCosts(entries){
  const s = { komicheCost:0, komicheCars:0, cementCost:0, cementKuntal:0, labor:0, water:0, other:0 };
  entries.forEach(e=>{
    s.komicheCost += num(e.komicheCost); s.komicheCars += num(e.komicheCars);
    s.cementCost += num(e.cementCost); s.cementKuntal += num(e.cementKuntal);
    s.labor += num(e.labor); s.water += num(e.water); s.other += num(e.other);
  });
  return s;
}
function costTotal(s){ return s.komicheCost + s.cementCost + s.labor + s.water + s.other; }
function sumProduction(entries){
  const s = { s10:0, s15:0, s20:0 };
  entries.forEach(e=>{ SIZES.forEach(sz=>{ s[sz.key] += num(e.qty[sz.key]); }); });
  return s;
}
function prodTotal(s){ return SIZES.reduce((a,sz)=>a+s[sz.key],0); }

function sumSales(entries){
  const s = { s10:{qty:0,revenue:0}, s15:{qty:0,revenue:0}, s20:{qty:0,revenue:0} };
  entries.forEach(e=>{
    SIZES.forEach(sz=>{
      const q = num(e.sizes[sz.key].qty);
      const p = num(e.sizes[sz.key].price);
      s[sz.key].qty += q;
      s[sz.key].revenue += q*p;
    });
  });
  return s;
}
function salesRevenueTotal(s){ return SIZES.reduce((a,sz)=>a+s[sz.key].revenue,0); }
function salesQtyTotal(s){ return SIZES.reduce((a,sz)=>a+s[sz.key].qty,0); }

function allYears(){
  const ys = new Set();
  state.costEntries.forEach(e=>ys.add(Number(e.monthKey.split('-')[0])));
  state.productionEntries.forEach(e=>ys.add(Number(e.monthKey.split('-')[0])));
  state.salesEntries.forEach(e=>ys.add(Number(e.monthKey.split('-')[0])));
  ys.add(ethFromDateStr(todayInputValue()).year);
  return Array.from(ys).sort((a,b)=>b-a);
}
function allMonthKeys(){
  const ks = new Set();
  state.costEntries.forEach(e=>ks.add(e.monthKey));
  state.productionEntries.forEach(e=>ks.add(e.monthKey));
  state.salesEntries.forEach(e=>ks.add(e.monthKey));
  return Array.from(ks).sort().reverse();
}

/* ============ BREAKDOWN HTML (pure output, safe to fully rebuild) ============ */
function breakdownHtml(costSum, prodSum, salesSum, opts){
  opts = opts || {};
  const total = costTotal(costSum);
  const revenue = salesRevenueTotal(salesSum);
  const profit = revenue - total;
  const bars = COST_ROWS.map(f=>{
    const v = costSum[f.key];
    const pct = total>0 ? (v/total*100) : 0;
    return `<div class="bar-row">
      <div class="label">${f.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
      <div class="val">${fmt(pct)}%</div>
    </div>`;
  }).join('');

  if (total<=0 && prodTotal(prodSum)<=0 && salesQtyTotal(salesSum)<=0){
    return `<div class="empty-hint">${opts.emptyText || 'No entries yet for this period.'}</div>`;
  }

  const statRow = `
    <div class="stat-row">
      <div class="stat-tile" style="background:var(--amber-soft);">
        <div class="stat-val">${fmt(total)}</div>
        <div class="stat-label">Cost (ETB)</div>
      </div>
      <div class="stat-tile" style="background:var(--teal-soft);">
        <div class="stat-val" style="color:var(--teal);">${fmt(revenue)}</div>
        <div class="stat-label">Revenue (ETB)</div>
      </div>
      <div class="stat-tile" style="background:${profit>=0?'var(--teal-soft)':'var(--red-soft)'};">
        <div class="stat-val" style="color:${profit>=0?'var(--teal)':'var(--red)'};">${fmt(profit)}</div>
        <div class="stat-label">Profit (ETB)</div>
      </div>
    </div>`;

  return statRow + `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Cost</th><th>Amount</th><th>Quantity</th></tr></thead>
        <tbody>
          <tr><td>Komiche</td><td>${fmt(costSum.komicheCost)} ETB</td><td>${fmt(costSum.komicheCars)} cars</td></tr>
          <tr><td>Cement</td><td>${fmt(costSum.cementCost)} ETB</td><td>${fmt(costSum.cementKuntal)} kuntal</td></tr>
          <tr><td>Labor</td><td>${fmt(costSum.labor)} ETB</td><td></td></tr>
          <tr><td>Water</td><td>${fmt(costSum.water)} ETB</td><td></td></tr>
          <tr><td>Other</td><td>${fmt(costSum.other)} ETB</td><td></td></tr>
          <tr class="grand"><td>Total cost</td><td class="amt">${fmt(total)} ETB</td><td></td></tr>
        </tbody>
      </table>
    </div>
    <div style="margin-top:16px;">${bars}</div>
    <div class="table-wrap" style="margin-top:16px;">
      <table>
        <thead><tr><th>Production</th><th>Qty</th></tr></thead>
        <tbody>
          ${SIZES.map(sz=>`<tr><td>${sz.label}</td><td>${fmt(prodSum[sz.key])}</td></tr>`).join('')}
          <tr class="grand"><td>Total bricks</td><td class="amt">${fmt(prodTotal(prodSum))}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="table-wrap" style="margin-top:16px;">
      <table>
        <thead><tr><th>Sales</th><th>Qty sold</th><th>Revenue</th></tr></thead>
        <tbody>
          ${SIZES.map(sz=>`<tr><td>${sz.label}</td><td>${fmt(salesSum[sz.key].qty)}</td><td>${fmt(salesSum[sz.key].revenue)} ETB</td></tr>`).join('')}
          <tr class="grand"><td>Total revenue</td><td class="amt">${fmt(salesQtyTotal(salesSum))}</td><td class="amt">${fmt(revenue)} ETB</td></tr>
        </tbody>
      </table>
    </div>`;
}

function showScreen(name){
  ['record','overview','history'].forEach(s=>{
    $(`screen-${s}`).hidden = (s!==name);
  });
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.screen===name);
  });
  window.scrollTo(0,0);
}

/* ============ LIVE TOTAL (targeted, never rebuilds inputs) ============ */
function updateCostEntryTotal(){
  const total = num($('komicheCost').value) + num($('cementCost').value) + num($('laborCost').value) + num($('waterCost').value) + num($('otherCost').value);
  $('out-costEntryTotal').textContent = fmt(total) + ' ETB';
}
function updateSaleEntryTotal(){
  let total = 0;
  SIZES.forEach(sz=>{ total += num($(`saleQty-${sz.key}`).value) * num($(`salePrice-${sz.key}`).value); });
  $('out-saleEntryTotal').textContent = fmt(total) + ' ETB';
}

/* ============ ACTIONS ============ */
function clearCostForm(){
  ['komicheCost','komicheCars','cementCost','cementKuntal','laborCost','waterCost','otherCost'].forEach(id=>{ $(id).value = ''; });
  $('costDate').value = todayInputValue();
  updateCostEntryTotal();
}
function clearProdForm(){
  SIZES.forEach(sz=>{ $(`prodQty-${sz.key}`).value = ''; });
  $('prodDate').value = todayInputValue();
}
function clearSaleForm(){
  SIZES.forEach(sz=>{ $(`saleQty-${sz.key}`).value = ''; $(`salePrice-${sz.key}`).value = ''; });
  $('saleDate').value = todayInputValue();
  updateSaleEntryTotal();
}

function addCostEntry(){
  const dateStr = $('costDate').value || todayInputValue();
  const komicheCost = num($('komicheCost').value);
  const komicheCars = num($('komicheCars').value);
  const cementCost = num($('cementCost').value);
  const cementKuntal = num($('cementKuntal').value);
  const labor = num($('laborCost').value);
  const water = num($('waterCost').value);
  const other = num($('otherCost').value);
  const total = komicheCost + cementCost + labor + water + other;
  if (total<=0){ showToast('Enter at least one cost amount'); return; }

  const eth = ethFromDateStr(dateStr);
  const dateKey = ethDateKey(eth), monthKey = ethMonthKey(eth);
  const wasEditing = state.editing.cost;

  if (wasEditing){
    const e = state.costEntries.find(x=>x.id===wasEditing);
    if (e) Object.assign(e, { dateKey, monthKey, komicheCost, komicheCars, cementCost, cementKuntal, labor, water, other, updatedAt: Date.now() });
    state.editing.cost = null;
    $('addCostBtn').textContent = 'Add cost entry';
    $('costCancelBtn').hidden = true;
  } else {
    state.costEntries.push({ id: uid(), dateKey, monthKey, komicheCost, komicheCars, cementCost, cementKuntal, labor, water, other, createdAt: Date.now() });
  }
  saveCosts();
  clearCostForm();
  showToast(wasEditing ? 'Cost entry updated' : 'Added to ' + dayLabel(dateKey));

  renderMonth();
  renderReport();
  renderHistory();
}

function addProductionEntry(){
  const dateStr = $('prodDate').value || todayInputValue();
  const qty = {};
  let total = 0;
  SIZES.forEach(sz=>{ qty[sz.key] = num($(`prodQty-${sz.key}`).value); total += qty[sz.key]; });
  if (total<=0){ showToast('Enter at least one quantity'); return; }

  const eth = ethFromDateStr(dateStr);
  const dateKey = ethDateKey(eth), monthKey = ethMonthKey(eth);
  const wasEditing = state.editing.production;

  if (wasEditing){
    const e = state.productionEntries.find(x=>x.id===wasEditing);
    if (e) Object.assign(e, { dateKey, monthKey, qty, updatedAt: Date.now() });
    state.editing.production = null;
    $('addProdBtn').textContent = 'Add production entry';
    $('prodCancelBtn').hidden = true;
  } else {
    state.productionEntries.push({ id: uid(), dateKey, monthKey, qty, createdAt: Date.now() });
  }
  saveProduction();
  clearProdForm();
  showToast(wasEditing ? 'Production entry updated' : 'Added to ' + dayLabel(dateKey));

  renderMonth();
  renderReport();
  renderHistory();
}

function addSaleEntry(){
  const dateStr = $('saleDate').value || todayInputValue();
  const sizes = {};
  let total = 0;
  SIZES.forEach(sz=>{
    const qty = num($(`saleQty-${sz.key}`).value);
    const price = num($(`salePrice-${sz.key}`).value);
    sizes[sz.key] = { qty, price };
    total += qty*price;
  });
  if (total<=0){ showToast('Enter a quantity and price for at least one size'); return; }

  const eth = ethFromDateStr(dateStr);
  const dateKey = ethDateKey(eth), monthKey = ethMonthKey(eth);
  const wasEditing = state.editing.sale;

  if (wasEditing){
    const e = state.salesEntries.find(x=>x.id===wasEditing);
    if (e) Object.assign(e, { dateKey, monthKey, sizes, updatedAt: Date.now() });
    state.editing.sale = null;
    $('addSaleBtn').textContent = 'Add sale entry';
    $('saleCancelBtn').hidden = true;
  } else {
    state.salesEntries.push({ id: uid(), dateKey, monthKey, sizes, createdAt: Date.now() });
  }
  saveSales();
  clearSaleForm();
  showToast(wasEditing ? 'Sale entry updated' : 'Added to ' + dayLabel(dateKey));

  renderMonth();
  renderReport();
  renderHistory();
}

function startEditCost(id){
  const e = state.costEntries.find(x=>x.id===id);
  if (!e) return;
  $('costDate').value = dateKeyToGregorianInput(e.dateKey);
  $('komicheCost').value = e.komicheCost || '';
  $('komicheCars').value = e.komicheCars || '';
  $('cementCost').value = e.cementCost || '';
  $('cementKuntal').value = e.cementKuntal || '';
  $('laborCost').value = e.labor || '';
  $('waterCost').value = e.water || '';
  $('otherCost').value = e.other || '';
  updateCostEntryTotal();
  state.editing.cost = id;
  $('addCostBtn').textContent = 'Save changes';
  $('costCancelBtn').hidden = false;
  $('costDate').scrollIntoView({ behavior:'smooth', block:'center' });
}
function cancelEditCost(){
  state.editing.cost = null;
  clearCostForm();
  $('addCostBtn').textContent = 'Add cost entry';
  $('costCancelBtn').hidden = true;
}

function startEditProduction(id){
  const e = state.productionEntries.find(x=>x.id===id);
  if (!e) return;
  $('prodDate').value = dateKeyToGregorianInput(e.dateKey);
  SIZES.forEach(sz=>{ $(`prodQty-${sz.key}`).value = e.qty[sz.key] || ''; });
  state.editing.production = id;
  $('addProdBtn').textContent = 'Save changes';
  $('prodCancelBtn').hidden = false;
  $('prodDate').scrollIntoView({ behavior:'smooth', block:'center' });
}
function cancelEditProduction(){
  state.editing.production = null;
  clearProdForm();
  $('addProdBtn').textContent = 'Add production entry';
  $('prodCancelBtn').hidden = true;
}

function startEditSale(id){
  const e = state.salesEntries.find(x=>x.id===id);
  if (!e) return;
  $('saleDate').value = dateKeyToGregorianInput(e.dateKey);
  SIZES.forEach(sz=>{
    $(`saleQty-${sz.key}`).value = e.sizes[sz.key].qty || '';
    $(`salePrice-${sz.key}`).value = e.sizes[sz.key].price || '';
  });
  updateSaleEntryTotal();
  state.editing.sale = id;
  $('addSaleBtn').textContent = 'Save changes';
  $('saleCancelBtn').hidden = false;
  $('saleDate').scrollIntoView({ behavior:'smooth', block:'center' });
}
function cancelEditSale(){
  state.editing.sale = null;
  clearSaleForm();
  $('addSaleBtn').textContent = 'Add sale entry';
  $('saleCancelBtn').hidden = true;
}
window.startEditCost = startEditCost;
window.startEditProduction = startEditProduction;
window.startEditSale = startEditSale;

function deleteCostEntry(id){
  if (!confirm('Delete this cost entry?')) return;
  state.costEntries = state.costEntries.filter(e=>e.id!==id);
  saveCosts();
  if (state.editing.cost===id) cancelEditCost();
  renderMonth(); renderReport(); renderHistory();
}
function deleteProductionEntry(id){
  if (!confirm('Delete this production entry?')) return;
  state.productionEntries = state.productionEntries.filter(e=>e.id!==id);
  saveProduction();
  if (state.editing.production===id) cancelEditProduction();
  renderMonth(); renderReport(); renderHistory();
}
function deleteSaleEntry(id){
  if (!confirm('Delete this sale entry?')) return;
  state.salesEntries = state.salesEntries.filter(e=>e.id!==id);
  saveSales();
  if (state.editing.sale===id) cancelEditSale();
  renderMonth(); renderReport(); renderHistory();
}
function toggleMonthDetail(key){
  state.openMonthKey = state.openMonthKey===key ? null : key;
  renderHistory();
}
window.deleteCostEntry = deleteCostEntry;
window.deleteProductionEntry = deleteProductionEntry;
window.deleteSaleEntry = deleteSaleEntry;
window.toggleMonthDetail = toggleMonthDetail;

/* ============ RENDER: THIS MONTH ============ */
function renderMonth(){
  const eth = ethFromDateStr(todayInputValue());
  const key = ethMonthKey(eth);
  $('monthTitle').textContent = 'This month — ' + monthLabel(key);
  const costSum = sumCosts(costsInYearRange(eth.year, eth.month, eth.month));
  const prodSum = sumProduction(productionInYearRange(eth.year, eth.month, eth.month));
  const saleSum = sumSales(salesInYearRange(eth.year, eth.month, eth.month));
  $('monthBody').innerHTML = breakdownHtml(costSum, prodSum, saleSum, { emptyText:'No entries added yet this month.' });
}

/* ============ RENDER: REPORTS ============ */
function renderReport(){
  const years = allYears();
  if (state.reportYear===null || !years.includes(state.reportYear)){
    state.reportYear = years[0];
  }
  const sel = $('reportYearSelect');
  sel.innerHTML = years.map(y=>`<option value="${y}" ${y===state.reportYear?'selected':''}>${y} E.C.</option>`).join('');

  document.querySelectorAll('.seg-btn').forEach(btn=>{
    btn.classList.toggle('active', parseInt(btn.dataset.period,10)===state.reportPeriod);
  });

  const monthNames = { 3:'first 3 months', 6:'first 6 months', 9:'first 9 months', 13:'full year' };
  const costSum = sumCosts(costsInYearRange(state.reportYear, 1, state.reportPeriod));
  const prodSum = sumProduction(productionInYearRange(state.reportYear, 1, state.reportPeriod));
  const saleSum = sumSales(salesInYearRange(state.reportYear, 1, state.reportPeriod));
  $('reportBody').innerHTML = `<p class="hint" style="margin:-6px 0 12px;">${monthNames[state.reportPeriod]} of ${state.reportYear} E.C.</p>` +
    breakdownHtml(costSum, prodSum, saleSum, { emptyText:'No entries yet for this period.' });
}

/* ============ RENDER: MONTHLY HISTORY ============ */
function monthDetailHtml(key){
  const costs = state.costEntries.filter(e=>e.monthKey===key).sort((a,b)=>a.dateKey.localeCompare(b.dateKey));
  const prods = state.productionEntries.filter(e=>e.monthKey===key).sort((a,b)=>a.dateKey.localeCompare(b.dateKey));
  const sales = state.salesEntries.filter(e=>e.monthKey===key).sort((a,b)=>a.dateKey.localeCompare(b.dateKey));
  const costRows = costs.map(e=>{
    const total = e.komicheCost+e.cementCost+e.labor+e.water+e.other;
    return `<div class="entry-row">
      <div class="er-main">
        <div class="er-date">${dayLabel(e.dateKey)}</div>
        <div>Komiche ${fmt(e.komicheCost)} (${fmt(e.komicheCars)} cars) &middot; Cement ${fmt(e.cementCost)} (${fmt(e.cementKuntal)} kuntal) &middot; Labor ${fmt(e.labor)} &middot; Water ${fmt(e.water)} &middot; Other ${fmt(e.other)} &mdash; <strong>${fmt(total)} ETB</strong></div>
      </div>
      <div class="history-actions">
        <button onclick="startEditCost('${e.id}')">Edit</button>
        <button onclick="deleteCostEntry('${e.id}')">Delete</button>
      </div>
    </div>`;
  }).join('') || `<div class="empty-hint">No cost entries.</div>`;
  const prodRows = prods.map(e=>{
    return `<div class="entry-row">
      <div class="er-main">
        <div class="er-date">${dayLabel(e.dateKey)}</div>
        <div>10": ${fmt(e.qty.s10)} &middot; 15": ${fmt(e.qty.s15)} &middot; 20": ${fmt(e.qty.s20)}</div>
      </div>
      <div class="history-actions">
        <button onclick="startEditProduction('${e.id}')">Edit</button>
        <button onclick="deleteProductionEntry('${e.id}')">Delete</button>
      </div>
    </div>`;
  }).join('') || `<div class="empty-hint">No production entries.</div>`;
  const saleRows = sales.map(e=>{
    const total = SIZES.reduce((a,sz)=>a+num(e.sizes[sz.key].qty)*num(e.sizes[sz.key].price),0);
    const parts = SIZES.map(sz=>`${sz.label} ${fmt(e.sizes[sz.key].qty)}@${fmt(e.sizes[sz.key].price)}`).join(' &middot; ');
    return `<div class="entry-row">
      <div class="er-main">
        <div class="er-date">${dayLabel(e.dateKey)}</div>
        <div>${parts} &mdash; <strong>${fmt(total)} ETB</strong></div>
      </div>
      <div class="history-actions">
        <button onclick="startEditSale('${e.id}')">Edit</button>
        <button onclick="deleteSaleEntry('${e.id}')">Delete</button>
      </div>
    </div>`;
  }).join('') || `<div class="empty-hint">No sale entries.</div>`;

  return `<div class="history-detail">
    <div style="font-weight:600; font-size:12.5px; margin-bottom:4px;">Costs</div>
    ${costRows}
    <div style="font-weight:600; font-size:12.5px; margin:14px 0 4px;">Production</div>
    ${prodRows}
    <div style="font-weight:600; font-size:12.5px; margin:14px 0 4px;">Sales</div>
    ${saleRows}
  </div>`;
}

function renderHistory(){
  const el = $('historyList');
  const keys = allMonthKeys();
  if (keys.length===0){
    el.innerHTML = `<div class="empty-hint">No entries yet.</div>`;
    return;
  }
  el.innerHTML = keys.map(k=>{
    const costSum = sumCosts(state.costEntries.filter(e=>e.monthKey===k));
    const prodSum = sumProduction(state.productionEntries.filter(e=>e.monthKey===k));
    const saleSum = sumSales(state.salesEntries.filter(e=>e.monthKey===k));
    const profit = salesRevenueTotal(saleSum) - costTotal(costSum);
    const open = state.openMonthKey===k;
    return `
      <div class="history-item">
        <div class="hi-top">
          <div>
            <div>${monthLabel(k)}</div>
            <div class="hi-date">${fmt(prodTotal(prodSum))} bricks &middot; cost ${fmt(costTotal(costSum))} ETB</div>
          </div>
          <div style="text-align:right;">
            <div class="hi-total" style="color:${profit>=0?'var(--teal)':'var(--red)'};">${fmt(profit)} ETB</div>
          </div>
          <div class="history-actions">
            <button onclick="toggleMonthDetail('${k}')">${open ? 'Hide' : 'View'}</button>
          </div>
        </div>
        ${open ? monthDetailHtml(k) : ''}
      </div>`;
  }).join('');
}

/* ============ BOOT ============ */
(function boot(){
  loadData();
  buildSkeleton();
  updateCostEntryTotal();
  renderMonth();
  renderReport();
  renderHistory();
})();
</script>
