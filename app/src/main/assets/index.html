<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Brick Factory Cost Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF7F0;
    --ink:#1F2A24;
    --ink-soft:#54615A;
    --gold:#E8A93B;
    --gold-dark:#C98C22;
    --teal:#1B6B5A;
    --teal-soft:#E4F1EC;
    --red:#C1523D;
    --red-soft:#F7E7E2;
    --amber-soft:#FBF0DA;
    --line:#E4DCCB;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:40px;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces',serif; }
  #app{ max-width:760px; margin:0 auto; padding:0 16px; }

  .topbar{ padding:22px 4px 6px; }
  .topbar .name{ font-family:'Fraunces',serif; font-weight:600; font-size:24px; letter-spacing:-0.01em; }
  .topbar .sub{ font-size:13px; color:var(--ink-soft); margin-top:4px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .card h2{ font-size:16px; margin:0 0 4px; }
  .card .hint{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; }

  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
  @media (max-width:520px){ .field-grid{ grid-template-columns:1fr; } }
  .field label{ display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
  .field .note{ font-size:11.5px; color:var(--ink-soft); font-weight:400; margin-left:4px; }
  .field input[type=number]{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14.5px;
    font-family:'Work Sans',sans-serif; background:#fff;
  }
  .field input[type=number]:focus{ outline:2px solid var(--teal); outline-offset:-1px; }

  .total-line{ display:flex; justify-content:space-between; align-items:center; padding-top:12px; margin-top:4px; border-top:1px dashed var(--line); font-weight:600; font-size:14.5px; }
  .total-line .amt{ font-family:'Fraunces',serif; color:var(--teal); font-size:17px; }

  .adv-toggle{ background:none; border:none; color:var(--teal); font-size:12.5px; font-weight:600; cursor:pointer; padding:0; margin-top:10px; }
  .adv-body{ margin-top:12px; }
  .adv-body[hidden]{ display:none; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ text-align:right; padding:9px 6px; border-bottom:1px solid var(--line); }
  th:first-child,td:first-child{ text-align:left; }
  th{ color:var(--ink-soft); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.02em; }
  td input[type=number]{ width:90px; text-align:right; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13.5px; font-family:'Work Sans',sans-serif; }
  tr.grand td{ font-weight:700; border-top:2px solid var(--ink); border-bottom:none; padding-top:12px; }
  tr.grand td.amt{ font-family:'Fraunces',serif; color:var(--teal); }
  .profit-neg{ color:var(--red); }
  .profit-pos{ color:var(--teal); }
  .table-wrap{ overflow-x:auto; }
  [hidden]{ display:none !important; }

  .bar-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; margin-bottom:8px; }
  .bar-row .label{ width:78px; flex-shrink:0; color:var(--ink-soft); }
  .bar-track{ flex:1; height:9px; background:var(--amber-soft); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--gold); }
  .bar-row .val{ width:80px; flex-shrink:0; text-align:right; font-weight:600; }

  .btn-row{ display:flex; gap:10px; margin:4px 0 22px; }
  .btn-primary{
    flex:1; background:var(--gold); color:var(--ink); border:none; border-radius:12px;
    padding:13px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:'Work Sans',sans-serif;
  }
  .btn-primary:active{ background:var(--gold-dark); }
  .btn-secondary{
    flex:1; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:12px;
    padding:13px; font-size:14.5px; font-weight:600; cursor:pointer;
  }

  .history-item{ padding:12px 4px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .history-item:last-child{ border-bottom:none; }
  .history-item .hi-top{ display:flex; justify-content:space-between; align-items:center; }
  .history-item .hi-date{ color:var(--ink-soft); font-size:12px; }
  .history-item .hi-total{ font-family:'Fraunces',serif; font-weight:600; color:var(--teal); }
  .history-actions button{ background:none; border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; margin-left:6px; }
  .history-detail{ margin-top:10px; }
  .empty-hint{ text-align:center; color:var(--ink-soft); font-size:13px; padding:16px 0; }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:10px; font-size:13px; z-index:999; opacity:0; transition:opacity .25s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ SIZES / FIELDS ============ */
const SIZES = [
  { key:'s10', label:'10" brick', defaultWeight:1 },
  { key:'s15', label:'15" brick', defaultWeight:1.5 },
  { key:'s20', label:'20" brick', defaultWeight:2 },
];
const COST_FIELDS = [
  { key:'komiche', label:'Komiche' },
  { key:'cement', label:'Cement' },
  { key:'labor', label:'Labor cost' },
  { key:'water', label:'Water' },
  { key:'other', label:'Other' },
];

/* ============ STATE ============ */
const state = {
  entry: {
    costs: { komiche:'', cement:'', labor:'', water:'', other:'' },
    qty: { s10:'', s15:'', s20:'' },
  },
  settings: {
    weight: { s10:1, s15:1.5, s20:2 },
    price: { s10:'', s15:'', s20:'' },
  },
  months: {}, // { "YYYY-MM": { costs:{...}, qty:{...}, firstEntryAt, lastUpdatedAt } }
  openMonth: null, // which past month row is expanded
};

/* ============ ETHIOPIAN CALENDAR ============ */
// Months add up "for the month" using the Ethiopian calendar, so the
// running total rolls over at Ethiopian New Year boundaries, not Gregorian ones.
const JD_EPOCH_OFFSET_AMETE_MIHRET = 1723856;
const ETHIOPIAN_MONTHS = ['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit','Megabit','Miazia','Ginbot','Sene','Hamle','Nehase','Pagume'];

function gregorianToJdn(year, month, day){
  const a = Math.floor((14 - month) / 12);
  const y = year + 4800 - a;
  const m = month + 12 * a - 3;
  return day + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
}
function jdnToEthiopian(jdn){
  const r = (jdn - JD_EPOCH_OFFSET_AMETE_MIHRET) % 1461;
  const n = (r % 365) + 365 * Math.floor(r / 1460);
  const year = 4 * Math.floor((jdn - JD_EPOCH_OFFSET_AMETE_MIHRET) / 1461) + Math.floor(r / 365) - Math.floor(r / 1460);
  const month = Math.floor(n / 30) + 1;
  const day = (n % 30) + 1;
  return { year, month, day };
}
function currentEthiopianDate(){
  const now = new Date();
  const jdn = gregorianToJdn(now.getFullYear(), now.getMonth()+1, now.getDate());
  return jdnToEthiopian(jdn);
}
function currentMonthKey(){
  const e = currentEthiopianDate();
  return e.year + '-' + String(e.month).padStart(2,'0');
}
function monthLabel(key){
  const parts = key.split('-');
  const year = parseInt(parts[0],10);
  const month = parseInt(parts[1],10);
  return (ETHIOPIAN_MONTHS[month-1] || ('Month '+month)) + ' ' + year + ' E.C.';
}

function loadSettings(){
  try {
    const raw = JSON.parse(localStorage.getItem('brickFactorySettings')||'null');
    if (raw){
      state.settings.weight = Object.assign(state.settings.weight, raw.weight||{});
      state.settings.price = Object.assign(state.settings.price, raw.price||{});
    }
  } catch(e){}
}
function saveSettings(){
  try { localStorage.setItem('brickFactorySettings', JSON.stringify(state.settings)); }
  catch(e){}
}
function loadMonths(){
  try { state.months = JSON.parse(localStorage.getItem('brickFactoryMonths')||'{}'); }
  catch(e){ state.months = {}; }
}
function saveMonths(){
  try { localStorage.setItem('brickFactoryMonths', JSON.stringify(state.months)); }
  catch(e){}
}

/* ============ HELPERS ============ */
function $(id){ return document.getElementById(id); }
function num(v){ const n = parseFloat(v); return isNaN(n) || n<0 ? 0 : n; }
function fmt(n){ return Number(n||0).toLocaleString('en-US', { maximumFractionDigits:2 }); }
function showToast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function emptyBucket(){
  return {
    costs: { komiche:0, cement:0, labor:0, water:0, other:0 },
    qty: { s10:0, s15:0, s20:0 },
  };
}

/* ============ ENTRY (not-yet-added) CALC ============ */
function entryTotalCost(){
  return COST_FIELDS.reduce((s,f)=>s+num(state.entry.costs[f.key]), 0);
}
function entryTotalQty(){
  return SIZES.reduce((s,sz)=>s+num(state.entry.qty[sz.key]), 0);
}

/* ============ MONTH BUCKET CALC (works for current or any past month) ============ */
function bucketFor(key){
  return state.months[key] || emptyBucket();
}
function bucketTotalCost(b){
  return COST_FIELDS.reduce((s,f)=>s+num(b.costs[f.key]), 0);
}
function bucketTotalQty(b){
  return SIZES.reduce((s,sz)=>s+num(b.qty[sz.key]), 0);
}
function bucketEquivUnits(b){
  return SIZES.reduce((s,sz)=>s+num(b.qty[sz.key])*num(state.settings.weight[sz.key]), 0);
}
function bucketBaseUnitCost(b){
  const eq = bucketEquivUnits(b);
  return eq>0 ? bucketTotalCost(b)/eq : 0;
}
function bucketUnitCostFor(b, szKey){
  return bucketBaseUnitCost(b) * num(state.settings.weight[szKey]);
}
function bucketTotalProfit(b){
  return SIZES.reduce((s,sz)=>{
    const qty = num(b.qty[sz.key]);
    const price = state.settings.price[sz.key];
    const hasPrice = price!=='' && price!=null;
    return s + (hasPrice ? (num(price)-bucketUnitCostFor(b, sz.key))*qty : 0);
  }, 0);
}

/* ============ ONE-TIME SKELETON BUILD ============ */
function buildSkeleton(){
  const app = $('app');
  app.innerHTML = `
    <div class="topbar">
      <div class="name">Brick Factory Cost Calculator</div>
      <div class="sub">Add each production run's costs below &mdash; they add up into a running total for the current Ethiopian calendar month, and each new month starts its own total automatically.</div>
    </div>

    <div class="card">
      <h2>New entry &mdash; manufacturing costs</h2>
      <p class="hint">Cost of this production run, in ETB. Cleared once you add it to the month.</p>
      <div class="field-grid">
        ${COST_FIELDS.map(f=>`
          <div class="field">
            <label>${f.label}</label>
            <input type="number" min="0" inputmode="decimal" id="entryCost-${f.key}" placeholder="0">
          </div>`).join('')}
      </div>
      <div class="total-line"><span>Total for this entry</span><span class="amt" id="out-entryTotal">0 ETB</span></div>
    </div>

    <div class="card">
      <h2>New entry &mdash; production quantities</h2>
      <p class="hint">How many of each brick size this run produced.</p>
      <div class="field-grid">
        ${SIZES.map(sz=>`
          <div class="field">
            <label>${sz.label}</label>
            <input type="number" min="0" inputmode="decimal" id="entryQty-${sz.key}" placeholder="0">
          </div>`).join('')}
      </div>
      <button class="adv-toggle" id="advToggleBtn">Adjust material-weight ratios &#9662;</button>
      <div class="adv-body" id="advBody" hidden>
        <p class="hint" style="margin-bottom:10px;">
          A bigger brick uses more raw material, so its share of the cost should be bigger too.
          These weights say how much material each size uses relative to the 10" brick (default 1&nbsp;:&nbsp;1.5&nbsp;:&nbsp;2) and apply to every month.
        </p>
        <div class="field-grid">
          ${SIZES.map(sz=>`
            <div class="field">
              <label>${sz.label} weight</label>
              <input type="number" min="0.01" step="0.01" id="weight-${sz.key}">
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Selling prices</h2>
      <p class="hint">Per-brick price in ETB &mdash; used to work out profit. Applies to every month until you change it.</p>
      <div class="field-grid">
        ${SIZES.map(sz=>`
          <div class="field">
            <label>${sz.label}</label>
            <input type="number" min="0" inputmode="decimal" id="price-${sz.key}" placeholder="&ndash;">
          </div>`).join('')}
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" id="clearEntryBtn">Clear entry</button>
      <button class="btn-primary" id="addEntryBtn">Add to this month</button>
    </div>

    <div class="card">
      <h2 id="monthTitle">This month</h2>
      <p class="hint">Running total for the current calendar month.</p>
      <div class="empty-hint" id="m-resultsEmpty">No entries added yet this month.</div>
      <div id="m-resultsBody" hidden>
        <div class="total-line"><span>Total cost this month</span><span class="amt" id="m-out-totalCost">0 ETB</span></div>
        <div class="table-wrap" style="margin-top:14px;">
          <table>
            <thead><tr>
              <th>Size</th><th>Qty</th><th>Cost / brick</th><th>Total cost</th><th>Profit / brick</th><th>Total profit</th>
            </tr></thead>
            <tbody>
              ${SIZES.map(sz=>`
                <tr>
                  <td>${sz.label}</td>
                  <td id="m-out-qty-${sz.key}">0</td>
                  <td id="m-out-unitCost-${sz.key}">0 ETB</td>
                  <td id="m-out-lineCost-${sz.key}">0 ETB</td>
                  <td id="m-out-profitUnit-${sz.key}">&ndash;</td>
                  <td id="m-out-profitLine-${sz.key}">&ndash;</td>
                </tr>`).join('')}
              <tr class="grand">
                <td>Total</td>
                <td id="m-out-grandQty">0</td>
                <td></td>
                <td class="amt" id="m-out-grandCost">0 ETB</td>
                <td></td>
                <td class="amt" id="m-out-grandProfit">0 ETB</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div style="margin-top:16px;">
          ${COST_FIELDS.map(f=>`
            <div class="bar-row">
              <div class="label">${f.label}</div>
              <div class="bar-track"><div class="bar-fill" id="m-bar-fill-${f.key}" style="width:0%;"></div></div>
              <div class="val" id="m-bar-val-${f.key}">0%</div>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Past months</h2>
      <div id="pastMonthsList"></div>
    </div>
  `;

  COST_FIELDS.forEach(f=>{
    $(`entryCost-${f.key}`).addEventListener('input', e=>{ state.entry.costs[f.key] = e.target.value; recomputeEntry(); });
  });
  SIZES.forEach(sz=>{
    $(`entryQty-${sz.key}`).addEventListener('input', e=>{ state.entry.qty[sz.key] = e.target.value; recomputeEntry(); });
    $(`weight-${sz.key}`).value = state.settings.weight[sz.key];
    $(`weight-${sz.key}`).addEventListener('input', e=>{
      state.settings.weight[sz.key] = e.target.value===''? '' : parseFloat(e.target.value);
      saveSettings();
      recomputeMonth();
      renderPastMonths();
    });
    $(`price-${sz.key}`).value = state.settings.price[sz.key];
    $(`price-${sz.key}`).addEventListener('input', e=>{
      state.settings.price[sz.key] = e.target.value;
      saveSettings();
      recomputeMonth();
      renderPastMonths();
    });
  });

  $('advToggleBtn').addEventListener('click', ()=>{
    const body = $('advBody');
    body.hidden = !body.hidden;
    $('advToggleBtn').innerHTML = (body.hidden ? 'Adjust' : 'Hide') + ' material-weight ratios &#9662;';
  });
  $('clearEntryBtn').addEventListener('click', clearEntry);
  $('addEntryBtn').addEventListener('click', addEntryToMonth);
}

/* ============ TARGETED RECOMPUTE: entry total (never rebuilds inputs) ============ */
function recomputeEntry(){
  $('out-entryTotal').textContent = fmt(entryTotalCost()) + ' ETB';
}

/* ============ TARGETED RECOMPUTE: this month's cumulative table ============ */
function recomputeMonth(){
  const key = currentMonthKey();
  $('monthTitle').textContent = 'This month — ' + monthLabel(key);
  const b = bucketFor(key);
  const hasData = bucketTotalQty(b) > 0;

  $('m-resultsEmpty').hidden = hasData;
  $('m-resultsBody').hidden = !hasData;
  if (!hasData) return;

  $('m-out-totalCost').textContent = fmt(bucketTotalCost(b)) + ' ETB';

  SIZES.forEach(sz=>{
    const qty = num(b.qty[sz.key]);
    const unitCost = bucketUnitCostFor(b, sz.key);
    const lineCost = unitCost*qty;
    const price = state.settings.price[sz.key];
    const hasPrice = price!=='' && price!=null;
    const profitUnit = hasPrice ? num(price)-unitCost : null;
    const profitLine = hasPrice ? profitUnit*qty : null;

    $(`m-out-qty-${sz.key}`).textContent = fmt(qty);
    $(`m-out-unitCost-${sz.key}`).textContent = fmt(unitCost) + ' ETB';
    $(`m-out-lineCost-${sz.key}`).textContent = fmt(lineCost) + ' ETB';

    const profitUnitEl = $(`m-out-profitUnit-${sz.key}`);
    const profitLineEl = $(`m-out-profitLine-${sz.key}`);
    profitUnitEl.textContent = hasPrice ? fmt(profitUnit)+' ETB' : '–';
    profitUnitEl.className = hasPrice ? (profitUnit>=0?'profit-pos':'profit-neg') : '';
    profitLineEl.textContent = hasPrice ? fmt(profitLine)+' ETB' : '–';
    profitLineEl.className = hasPrice ? (profitLine>=0?'profit-pos':'profit-neg') : '';
  });
  $('m-out-grandQty').textContent = fmt(bucketTotalQty(b));
  $('m-out-grandCost').textContent = fmt(bucketTotalCost(b)) + ' ETB';
  $('m-out-grandProfit').textContent = fmt(bucketTotalProfit(b)) + ' ETB';

  const total = bucketTotalCost(b);
  COST_FIELDS.forEach(f=>{
    const v = num(b.costs[f.key]);
    const pct = total>0 ? (v/total*100) : 0;
    $(`m-bar-fill-${f.key}`).style.width = pct + '%';
    $(`m-bar-val-${f.key}`).textContent = fmt(pct) + '%';
  });
}

/* ============ ACTIONS ============ */
function clearEntry(){
  state.entry.costs = { komiche:'', cement:'', labor:'', water:'', other:'' };
  state.entry.qty = { s10:'', s15:'', s20:'' };
  applyEntryToInputs();
  recomputeEntry();
}
function applyEntryToInputs(){
  COST_FIELDS.forEach(f=>{ $(`entryCost-${f.key}`).value = state.entry.costs[f.key]; });
  SIZES.forEach(sz=>{ $(`entryQty-${sz.key}`).value = state.entry.qty[sz.key]; });
}

function addEntryToMonth(){
  if (entryTotalCost()<=0 || entryTotalQty()<=0){ showToast('Add costs and quantities first'); return; }
  const key = currentMonthKey();
  const bucket = state.months[key] || Object.assign(emptyBucket(), { firstEntryAt: Date.now() });
  COST_FIELDS.forEach(f=>{ bucket.costs[f.key] = num(bucket.costs[f.key]) + num(state.entry.costs[f.key]); });
  SIZES.forEach(sz=>{ bucket.qty[sz.key] = num(bucket.qty[sz.key]) + num(state.entry.qty[sz.key]); });
  bucket.lastUpdatedAt = Date.now();
  state.months[key] = bucket;
  saveMonths();

  clearEntry();
  recomputeMonth();
  showToast('Added to ' + monthLabel(key));
}

function deleteMonth(key){
  if (!confirm('Delete all data for ' + monthLabel(key) + '?')) return;
  delete state.months[key];
  saveMonths();
  renderPastMonths();
}
function toggleMonthDetail(key){
  state.openMonth = state.openMonth===key ? null : key;
  renderPastMonths();
}
window.deleteMonth = deleteMonth;
window.toggleMonthDetail = toggleMonthDetail;

function monthDetailHtml(key){
  const b = bucketFor(key);
  return `
    <div class="history-detail">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Size</th><th>Qty</th><th>Cost / brick</th><th>Total cost</th><th>Profit / brick</th><th>Total profit</th></tr></thead>
          <tbody>
            ${SIZES.map(sz=>{
              const qty = num(b.qty[sz.key]);
              const unitCost = bucketUnitCostFor(b, sz.key);
              const price = state.settings.price[sz.key];
              const hasPrice = price!=='' && price!=null;
              const profitUnit = hasPrice ? num(price)-unitCost : null;
              return `<tr>
                <td>${sz.label}</td>
                <td>${fmt(qty)}</td>
                <td>${fmt(unitCost)} ETB</td>
                <td>${fmt(unitCost*qty)} ETB</td>
                <td class="${hasPrice ? (profitUnit>=0?'profit-pos':'profit-neg') : ''}">${hasPrice ? fmt(profitUnit)+' ETB' : '&ndash;'}</td>
                <td class="${hasPrice ? (profitUnit>=0?'profit-pos':'profit-neg') : ''}">${hasPrice ? fmt(profitUnit*qty)+' ETB' : '&ndash;'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderPastMonths(){
  const el = $('pastMonthsList');
  const key = currentMonthKey();
  const keys = Object.keys(state.months).filter(k=>k!==key).sort().reverse();
  if (keys.length===0){
    el.innerHTML = `<div class="empty-hint">No past months yet &mdash; they'll show up here once a new month starts.</div>`;
    return;
  }
  el.innerHTML = keys.map(k=>{
    const b = bucketFor(k);
    const open = state.openMonth===k;
    return `
      <div class="history-item">
        <div class="hi-top">
          <div>
            <div>${monthLabel(k)}</div>
            <div class="hi-date">${fmt(bucketTotalQty(b))} bricks</div>
          </div>
          <div style="text-align:right;">
            <div class="hi-total">${fmt(bucketTotalCost(b))} ETB</div>
          </div>
          <div class="history-actions">
            <button onclick="toggleMonthDetail('${k}')">${open ? 'Hide' : 'View'}</button>
            <button onclick="deleteMonth('${k}')">Delete</button>
          </div>
        </div>
        ${open ? monthDetailHtml(k) : ''}
      </div>`;
  }).join('');
}

/* ============ BOOT ============ */
(function boot(){
  loadSettings();
  loadMonths();
  buildSkeleton();
  recomputeEntry();
  recomputeMonth();
  renderPastMonths();
})();
</script>
</body>
</html>
